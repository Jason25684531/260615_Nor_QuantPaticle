project:
  name: "TWSE Factor Research & Multi-Factor Backtest Lab"

data:
  primary_source: "twse_openapi"
  fallback_source: "yfinance"
  start_date: "2018-01-01"
  end_date: "2025-12-31"
  cache_format: "parquet"
  ohlcv_ticker_limit: null
  ohlcv:
    # Ingestion/runtime bound only; it never defines research-universe eligibility.
    ticker_limit: null
    batch_size: 20
    retry: 3
    sleep_seconds: 1
    fail_fast: false

universe:
  membership: current_listed_only
  liquidity:
    enabled: true
    window: 20
    measure: median
    minimum_traded_value: 50000000

research_quality:
  minimum_universe_coverage: 0.90

research:
  in_sample:
    start: "2018-01-02"
    end: "2022-12-31"
  out_of_sample:
    start: "2023-01-01"
    end: "2025-12-31"

twse:
  base_url: "https://openapi.twse.com.tw/v1"
  timeout_seconds: 30

fundamental:
  start_roc_year: 102
  acceptance_tickers: ["2330"]
  throttle_seconds: 0.5
  retry: 3
  mops_timeout_seconds: 90
  mops_statement_min_ticker_count: 100
  availability_policy: next_trading_day
  missing_publication_date: exclude
  raw_cache_dir: "data/raw/fundamental"


reference:
  repo: "ZJHuang915/PythonQuantTrading"
  usage: "reference_only"

paths:
  universe: "data/processed/universe.parquet"
  valuation: "data/processed/valuation.parquet"
  ohlcv: "data/processed/ohlcv.parquet"
  research_universe: "data/processed/research_universe.parquet"
  universe_coverage: "data/processed/universe_coverage.parquet"
  data_quality_report: "reports/data_quality_summary.md"
  close_matrix: "data/processed/close_matrix.parquet"
  high_matrix: "data/processed/high_matrix.parquet"
  low_matrix: "data/processed/low_matrix.parquet"
  volume_matrix: "data/processed/volume_matrix.parquet"
  factors_price_volume: "data/processed/factors_price_volume.parquet"
  factors_fundamental: "data/processed/factors_fundamental.parquet"
  factors_valuation_snapshot: "data/processed/factors_valuation_snapshot.parquet"
  factors_composite: "data/processed/factors_composite.parquet"
  factor_quality_report: "reports/factor_quality_summary.md"
  factor_forward_returns: "data/processed/factor_forward_returns.parquet"
  factor_ic_summary: "data/processed/factor_ic_summary.parquet"
  factor_quantile_returns: "data/processed/factor_quantile_returns.parquet"
  factor_turnover: "data/processed/factor_turnover.parquet"
  factor_monotonicity: "data/processed/factor_monotonicity.parquet"
  factor_analysis_report: "reports/factor_analysis_report.md"
  factor_scoreboard: "data/processed/factor_scoreboard.parquet"
  factor_ic_daily: "data/processed/factor_ic_daily.parquet"
  factor_correlation: "data/processed/factor_correlation.parquet"
  failed_tickers: "data/processed/failed_ohlcv_tickers.parquet"
  factor_tearsheet_dir: "reports/factors"
  factor_research_summary: "reports/factor_research_summary.md"
  selected_factor_scores: "data/processed/selected_factor_scores.parquet"
  topn_positions: "data/processed/topn_positions.parquet"
  portfolio_weights: "data/processed/portfolio_weights.parquet"
  backtest_results: "data/processed/backtest_results.parquet"
  backtest_metrics: "data/processed/backtest_metrics.parquet"
  composite_factor_report: "reports/composite_factor_report.md"
  backtest_report: "reports/backtest_report.md"
  manifest: "data/processed/_manifest.json"
  fundamental_pit: "data/processed/fundamental_pit.parquet"
  fundamental_matrix: "data/processed/fundamental_matrix.parquet"
  valuation_daily: "data/processed/valuation_daily.parquet"
  fundamental_coverage: "data/processed/fundamental_coverage.parquet"
  fundamental_coverage_report: "reports/fundamental_coverage_report.md"
  composite_factor_weights: "data/processed/composite_factor_weights.parquet"
  composite_scores: "data/processed/composite_scores.parquet"
  market_breadth: "data/processed/market_breadth.parquet"
  portfolio_targets: "data/processed/portfolio_targets.parquet"
  portfolio_scenarios: "data/processed/portfolio_scenarios.parquet"
  market_breadth_report: "reports/market_breadth_report.md"
  d35_strategy_report: "reports/d35_strategy_report.md"

week2:
  manifest_schema_version: "1.0.0"

analysis:
  horizons: [1, 5, 10, 20]
  quantiles: 5
  factors:
    historical:
      - momentum_60d
      - low_volatility_20d
      - volume_ratio_5d_60d
    optional_composites:
      - historical_price_volume
    excluded_snapshot:
      - pb_inverse
      - pe_inverse
      - dividend_yield
      - latest_snapshot_mixed
    ranking:
      rsi_z: {direction: higher_is_better, family: TECHNICAL}
      momentum_40d: {direction: higher_is_better, family: TECHNICAL}
      risk_adjusted_momentum: {direction: higher_is_better, family: TECHNICAL}
      obv_z90: {direction: higher_is_better, family: TECHNICAL}
      natr_14: {direction: lower_is_better, family: TECHNICAL}
      revenue_yoy: {direction: higher_is_better, family: FUNDAMENTAL}
      eps: {direction: higher_is_better, family: FUNDAMENTAL}
      roe: {direction: higher_is_better, family: FUNDAMENTAL}
      pe: {direction: lower_is_better, family: FUNDAMENTAL}
      pb: {direction: lower_is_better, family: FUNDAMENTAL}
      dividend_yield: {direction: higher_is_better, family: FUNDAMENTAL}
  d3:
    rsi_period: 28
    rsi_z_window: 90
    momentum_period: 40
    atr_period: 14
    obv_z_window: 90
    ma_short: 60
    ma_long: 120
    correlation_min_samples: 30
    scoreboard: {min_coverage: 0.2, min_ic_observations: 20, min_abs_ir: 0.02, correlation_warning: 0.8}

composite35:
  # Canonical D3 archived candidate pool (multi-factor-research-v1). Selection
  # must never expand beyond this list without a new research cycle.
  canonical_pool:
    - historical_price_volume
    - momentum_40d
    - momentum_60d
    - obv_z90
    - risk_adjusted_momentum
    - rsi_z
    - volume_ratio_5d_60d
  family:
    MOMENTUM: [momentum_40d, momentum_60d, risk_adjusted_momentum]
    PRICE_VOLUME: [historical_price_volume, obv_z90, volume_ratio_5d_60d]
    OSCILLATOR: [rsi_z]
  correlation_cap: 0.8
  min_valid_factor_count: 2

breadth:
  ma_column: ma_60
  threshold: 0.40
  exposure_high: 1.0
  exposure_low: 0.5

backtest:
  enabled: true
  min_ticker_count: 100
  factor_name: historical_price_volume
  top_n: 20
  top_n_grid: [10, 20, 30]
  rebalance_frequency: daily
  rebalance_frequency_grid: ["daily", "weekly", "monthly"]
  execution_lag_days: 1
  initial_cash: 1000000
  fees:
    buy_fee_rate: 0.001425
    sell_fee_rate: 0.001425
    transaction_tax_rate: 0.003
    slippage_rate: 0.001
  rules:
    hold_until_drop: true
    drop_rank_buffer: 30
    rebalance_only_on_schedule: true
  cost_sensitivity:
    enabled: true
    scenarios:
      - name: no_cost
        buy_fee_rate: 0.0
        sell_fee_rate: 0.0
        transaction_tax_rate: 0.0
        slippage_rate: 0.0
      - name: half_cost
        buy_fee_rate: 0.0007125
        sell_fee_rate: 0.0007125
        transaction_tax_rate: 0.0015
        slippage_rate: 0.0005
      - name: base_cost
        buy_fee_rate: 0.001425
        sell_fee_rate: 0.001425
        transaction_tax_rate: 0.003
        slippage_rate: 0.001
      - name: high_cost
        buy_fee_rate: 0.002
        sell_fee_rate: 0.002
        transaction_tax_rate: 0.003
        slippage_rate: 0.002
  vectorbt:
    use_vectorbt: true
    allow_fallback: true

robustness:
  top_n: {values: [10, 20, 30]}
  buffer: {values: [20, 30, 40]}
  breadth_threshold: {values: [0.35, 0.40, 0.45]}
  rebalance: {values: [daily, weekly, monthly]}
  cost_multiplier: {values: [0.0, 0.5, 1.0, 2.0]}
  is_oos:
    rule: chronological_70_30
    is_fraction: 0.70
    oos_initial_capital: canonical
  regression:
    hac_lags: automatic  # floor(4 * (T / 100) ** (2 / 9))
  verdict:
    stable_sharpe_ratio: 0.7
    degraded_sharpe_ratio: 0.3
    stable_max_drawdown_multiple: 1.5
    minimum_observations: 252
